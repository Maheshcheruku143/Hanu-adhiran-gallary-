<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanu Adhiran</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
}

header{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(45deg,#000,#222);
text-align:center;
}

header h1{
font-size:55px;
color:#FFD700;
margin-bottom:15px;
}

header h2{
font-size:35px;
}

header p{
margin-top:15px;
font-size:20px;
}

.btn{
margin-top:35px;
padding:15px 40px;
background:#FFD700;
color:#000;
text-decoration:none;
font-size:20px;
font-weight:bold;
border-radius:50px;
}

.gallery{
padding:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.gallery img{
width:100%;
height:320px;
object-fit:cover;
border:8px solid #FFD700;
border-radius:15px;
transition:.4s;
cursor:pointer;
}

.gallery img:hover{
transform:scale(1.05);
box-shadow:0 0 20px yellow;
}

footer{
padding:30px;
text-align:center;
font-size:18px;
background:#111;
}
</style>

</head>
<body>

<header>

<h1>THANK YOU FOR VISITING ❤️</h1>

<h2>My Name is</h2>

<h1>Mahesh </h1>

<p>Welcome To My Personal Photo Gallery</p>

<a href="#photos" class="btn">View Photos</a>

</header>

<section class="gallery" id="photos">

<img src="20.jpg">
<img src="5.jpg">
<img src="9.jpg">
<img src="2.jpg">
<img src="5.jpg">
<img src="6.jpg">
<img src="7.jpg">

<img src="4.jpg">
<img src="10.jpg">
<img src="11.jpg">
<img src="12.jpg">
<img src="13.jpg">
<img src="20.jpg">
<img src="10.jpg">
<img src="8.jpg">
<img src="3.jpg">
<img src="4.jpg">
  

</section>

<footer>

❤️ Designed for Mahesh ❤️

</footer>

</body>
</html>
